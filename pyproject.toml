[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compatpower"
dynamic = ["version"]
description = "Power, equivalence and design of in vitro compatibility assays between biological control agents and pesticides"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Allan Lincoln Rodrigues Siriani" },
  { name = "Susi Meire Maximino Leite" },
]
keywords = ["statistical power", "equivalence test", "compatibility", "entomopathogenic fungi", "biological control", "pesticides", "experimental design"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
compatpower = "compatpower.cli:main"

[project.urls]
Repository = "https://github.com/siriani/compatpower"

[tool.hatch.version]
path = "src/compatpower/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/compatpower"]
